# GoReleaser v2 config — cross-platform binary release
# Docs: https://goreleaser.com/customization/
# Triggered by .github/workflows/release.yml on tag push (v*.*.*)

version: 2

project_name: wayneblacktea

before:
  hooks:
    # cmd/server uses //go:embed web/dist — build the SPA before compiling
    - sh -c 'cd web && npm ci --ignore-scripts'
    - sh -c 'cd web && npm run build'
    - sh -c 'mkdir -p cmd/server/web && rm -rf cmd/server/web/dist && cp -r web/dist cmd/server/web/dist'
    # Build the DXT package AFTER `release --clean` wiped ./dist, so it survives.
    # The version placeholder in manifest.json is replaced with the real tag, then
    # manifest.json + icon.png are zipped into build/dxt/staging/wayneblacktea.dxt
    # (referenced by release.extra_files below). Writing OUTSIDE ./dist is required:
    # goreleaser's "ensuring distribution directory" step (which runs AFTER before
    # hooks) rejects a non-empty ./dist, so the .dxt cannot live in ./dist itself —
    # extra_files copies it into the release upload from this staging path.
    - >-
      sh -c '
      rm -rf build/dxt/staging && mkdir -p build/dxt/staging/pkg &&
      sed "s/\"version\": \"0.0.0\"/\"version\": \"{{ .Version }}\"/" build/dxt/manifest.json > build/dxt/staging/pkg/manifest.json &&
      cp build/dxt/icon.png build/dxt/staging/pkg/icon.png &&
      (cd build/dxt/staging/pkg && zip -X -q ../wayneblacktea.dxt manifest.json icon.png) &&
      rm -rf build/dxt/staging/pkg
      '

builds:
  - id: server
    binary: wayneblacktea-server
    main: ./cmd/server
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      # -X main.version/commit/date are legacy no-ops for this binary: cmd/server
      # has never declared its own version/commit/date vars, so these three
      # flags previously had no effect at all. The internal/buildinfo flags
      # below are what actually reach the MCP server (internal/mcp/server.go
      # reads buildinfo.Version for serverInfo.version and the
      # wayneblacktea://system/build-info resource — GTD 61838147). Kept
      # alongside rather than removed in case a future cmd/server/main.go
      # startup log wants its own version vars without importing buildinfo.
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
        -X github.com/Wayne997035/wayneblacktea/internal/buildinfo.Version={{.Version}}
        -X github.com/Wayne997035/wayneblacktea/internal/buildinfo.Commit={{.Commit}}
        -X github.com/Wayne997035/wayneblacktea/internal/buildinfo.Date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

  - id: seed
    binary: wayneblacktea-seed
    main: ./cmd/seed
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

  - id: wbt
    binary: wbt
    main: ./cmd/wbt
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      # -X main.version/commit/date feed `wbt version`'s own CLI output
      # (cmd/wbt/main.go). The internal/buildinfo flags below are ADDITIONAL:
      # `wbt mcp` runs the same MCP server as the `server` build id above
      # (internal/mcprunner -> internal/mcp), so it needs the same
      # buildinfo.Version/Commit/Date for serverInfo.version and the
      # wayneblacktea://system/build-info resource — GTD 61838147. Without
      # this block, `wbt mcp` would report the sentinel "dev" forever even in
      # a tagged release, while the HTTP transport (server build id) reports
      # the real tag: the exact two-transports-drift bug this PR exists to
      # avoid.
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
        -X github.com/Wayne997035/wayneblacktea/internal/buildinfo.Version={{.Version}}
        -X github.com/Wayne997035/wayneblacktea/internal/buildinfo.Commit={{.Commit}}
        -X github.com/Wayne997035/wayneblacktea/internal/buildinfo.Date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

  - id: wbt-context
    binary: wbt-context
    main: ./cmd/wbt-context
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

  - id: wbt-hook
    binary: wbt-hook
    main: ./cmd/wbt-hook
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

  - id: wbt-guard
    binary: wbt-guard
    main: ./cmd/wbt-guard
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

  - id: wbt-doctor
    binary: wbt-doctor
    main: ./cmd/doctor
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: server
    ids:
      - server
    name_template: >-
      wayneblacktea-server_{{ .Version }}_
      {{- if eq .Os "darwin" }}macos
      {{- else }}{{ .Os }}{{ end }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

  - id: seed
    ids:
      - seed
    name_template: >-
      wayneblacktea-seed_{{ .Version }}_
      {{- if eq .Os "darwin" }}macos
      {{- else }}{{ .Os }}{{ end }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

  - id: cli
    ids:
      - wbt
      - wbt-context
      - wbt-hook
      - wbt-guard
      - wbt-doctor
    name_template: >-
      wayneblacktea-cli_{{ .Version }}_
      {{- if eq .Os "darwin" }}macos
      {{- else }}{{ .Os }}{{ end }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

homebrew_casks:
  # CLI bundle — wbt + the four sidecar binaries, all placed on PATH.
  - name: wayneblacktea-cli
    description: "wayneblacktea CLI — wbt installer + SessionStart/PostToolUse/Stop hook + guard binaries"
    homepage: "https://github.com/Wayne997035/wayneblacktea"
    ids:
      - cli
    binaries:
      - wbt
      - wbt-context
      - wbt-hook
      - wbt-guard
      - wbt-doctor
    repository:
      owner: Wayne997035
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    caveats: |
      Finish setup by running:
        wbt setup
    hooks:
      post:
        install: |
          if OS.mac?
            ["wbt", "wbt-context", "wbt-hook", "wbt-guard", "wbt-doctor"].each do |bin|
              system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/#{bin}"]
            end
          end

  # HTTP + MCP server binary.
  - name: wayneblacktea-server
    description: "wayneblacktea server — HTTP API + MCP transport for the Personal OS / GTD store"
    homepage: "https://github.com/Wayne997035/wayneblacktea"
    ids:
      - server
    binaries:
      - wayneblacktea-server
    repository:
      owner: Wayne997035
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    caveats: |
      Finish setup by running:
        wbt setup
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/wayneblacktea-server"]
          end

checksum:
  name_template: "checksums.txt"
  algorithm: sha256
  # Include the before-hook-built .dxt in checksums.txt. goreleaser v2 excludes
  # release.extra_files from the checksum manifest, and cosign only signs
  # checksums.txt — so without this the .dxt would ship with no integrity
  # coverage. Glob MUST match the before-hook output path and release.extra_files.
  extra_files:
    - glob: ./build/dxt/staging/wayneblacktea.dxt

# cosign v3 起改用 bundle:憑證與簽章合併成一個 .sigstore.json,而
# --output-signature / --output-certificate 被廢棄。**它們不是失敗,是被忽略** ——
# 新格式下 cosign 仍要寫 bundle,而沒人給路徑,於是它拿空字串去開檔:
#   Error: signing dist/checksums.txt: create bundle file: open : no such file or directory
# v1.0.0 的第一次發佈就是掛在這裡(7 支 binary 全建完、打包完、checksum 算完,
# 掛在最後一步),GitHub Release 因此完全沒有建立。
#
# goreleaser **沒有** ${bundle} 樣板變數(只有 ${artifact} / ${artifactID} /
# ${signature} / ${certificate}),所以正解是把 signature 設成 bundle 檔名、
# 再餵給 --bundle。依 https://goreleaser.com/blog/cosign-v3/
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --bundle=${signature}
      - ${artifact}
      - --yes
    artifacts: checksum
    output: true

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "Merge pull request"
      - "Merge branch"
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999

release:
  github:
    owner: Wayne997035
    name: wayneblacktea
  draft: false
  prerelease: auto
  mode: replace
  name_template: "v{{ .Version }}"
  # Built by the before-hook (after `release --clean` wiped ./dist) into a staging
  # path OUTSIDE ./dist, so it survives goreleaser's dist empty-check and is uploaded
  # as a release asset for Claude Desktop one-click install.
  extra_files:
    - glob: ./build/dxt/staging/wayneblacktea.dxt
