# GoReleaser v2 config — cross-platform binary release
# Docs: https://goreleaser.com/customization/
# Triggered by .github/workflows/release.yml on tag push (v*.*.*)

version: 2

project_name: wayneblacktea

before:
  hooks:
    # cmd/server uses //go:embed web/dist — build the SPA before compiling
    - sh -c 'cd web && npm ci --ignore-scripts'
    - sh -c 'cd web && npm run build'
    - sh -c 'mkdir -p cmd/server/web && rm -rf cmd/server/web/dist && cp -r web/dist cmd/server/web/dist'
    # Build the DXT package AFTER `release --clean` wiped ./dist, so it survives.
    # The version placeholder in manifest.json is replaced with the real tag, then
    # manifest.json + icon.png are zipped into build/dxt/staging/wayneblacktea.dxt
    # (referenced by release.extra_files below). Writing OUTSIDE ./dist is required:
    # goreleaser's "ensuring distribution directory" step (which runs AFTER before
    # hooks) rejects a non-empty ./dist, so the .dxt cannot live in ./dist itself —
    # extra_files copies it into the release upload from this staging path.
    - >-
      sh -c '
      rm -rf build/dxt/staging && mkdir -p build/dxt/staging/pkg &&
      sed "s/\"version\": \"0.0.0\"/\"version\": \"{{ .Version }}\"/" build/dxt/manifest.json > build/dxt/staging/pkg/manifest.json &&
      cp build/dxt/icon.png build/dxt/staging/pkg/icon.png &&
      (cd build/dxt/staging/pkg && zip -X -q ../wayneblacktea.dxt manifest.json icon.png) &&
      rm -rf build/dxt/staging/pkg
      '

builds:
  - id: server
    binary: wayneblacktea-server
    main: ./cmd/server
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

  - id: seed
    binary: wayneblacktea-seed
    main: ./cmd/seed
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

  - id: wbt
    binary: wbt
    main: ./cmd/wbt
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

  - id: wbt-context
    binary: wbt-context
    main: ./cmd/wbt-context
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

  - id: wbt-hook
    binary: wbt-hook
    main: ./cmd/wbt-hook
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

  - id: wbt-guard
    binary: wbt-guard
    main: ./cmd/wbt-guard
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

  - id: wbt-doctor
    binary: wbt-doctor
    main: ./cmd/doctor
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: server
    ids:
      - server
    name_template: >-
      wayneblacktea-server_{{ .Version }}_
      {{- if eq .Os "darwin" }}macos
      {{- else }}{{ .Os }}{{ end }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

  - id: seed
    ids:
      - seed
    name_template: >-
      wayneblacktea-seed_{{ .Version }}_
      {{- if eq .Os "darwin" }}macos
      {{- else }}{{ .Os }}{{ end }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

  - id: cli
    ids:
      - wbt
      - wbt-context
      - wbt-hook
      - wbt-guard
      - wbt-doctor
    name_template: >-
      wayneblacktea-cli_{{ .Version }}_
      {{- if eq .Os "darwin" }}macos
      {{- else }}{{ .Os }}{{ end }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

homebrew_casks:
  # CLI bundle — wbt + the four sidecar binaries, all placed on PATH.
  - name: wayneblacktea-cli
    description: "wayneblacktea CLI — wbt installer + SessionStart/PostToolUse/Stop hook + guard binaries"
    homepage: "https://github.com/Wayne997035/wayneblacktea"
    ids:
      - cli
    binaries:
      - wbt
      - wbt-context
      - wbt-hook
      - wbt-guard
      - wbt-doctor
    repository:
      owner: Wayne997035
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    caveats: |
      Finish setup by running:
        wbt setup
    hooks:
      post:
        install: |
          if OS.mac?
            ["wbt", "wbt-context", "wbt-hook", "wbt-guard", "wbt-doctor"].each do |bin|
              system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/#{bin}"]
            end
          end

  # HTTP + MCP server binary.
  - name: wayneblacktea-server
    description: "wayneblacktea server — HTTP API + MCP transport for the Personal OS / GTD store"
    homepage: "https://github.com/Wayne997035/wayneblacktea"
    ids:
      - server
    binaries:
      - wayneblacktea-server
    repository:
      owner: Wayne997035
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    caveats: |
      Finish setup by running:
        wbt setup
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/wayneblacktea-server"]
          end

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

signs:
  - cmd: cosign
    args:
      - sign-blob
      - --yes
      - --output-signature=${signature}
      - --output-certificate=${certificate}
      - ${artifact}
    artifacts: checksum
    output: true

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "Merge pull request"
      - "Merge branch"
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999

release:
  github:
    owner: Wayne997035
    name: wayneblacktea
  draft: false
  prerelease: auto
  mode: replace
  name_template: "v{{ .Version }}"
  # Built by the before-hook (after `release --clean` wiped ./dist) into a staging
  # path OUTSIDE ./dist, so it survives goreleaser's dist empty-check and is uploaded
  # as a release asset for Claude Desktop one-click install.
  extra_files:
    - glob: ./build/dxt/staging/wayneblacktea.dxt
