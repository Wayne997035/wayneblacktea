version: "2"
sql:
  - engine: "postgresql"
    queries: "sql/queries/"
    schema:
      # Full glob instead of a hand-curated file list — the previous list
      # silently drifted out of sync (only 22 of 67 migrations were tracked),
      # so sqlc's catalog was missing schema changes from ~45 migrations
      # affecting tables it does track. Non-DDL migrations (e.g. 000015's
      # backfill UPDATEs, 000036's SELECT 1 marker) are harmless here — sqlc
      # only extracts DDL statements when building its catalog.
      - "migrations/*.up.sql"
    gen:
      go:
        package: "db"
        out: "internal/db"
        emit_json_tags: true
        emit_interface: true
        emit_exact_table_names: false
        sql_package: "pgx/v5"
        rename:
          pr_url: "PRUrl"
          commit_shas: "CommitSHAs"
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "pg_catalog.timestamptz"
            nullable: false
            go_type: "time.Time"
          - db_type: "pg_catalog.timestamptz"
            nullable: true
            go_type:
              import: "database/sql"
              type: "NullTime"
          - db_type: "vector"
            go_type: "string"
