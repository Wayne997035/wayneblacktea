version: '3'

vars:
  GO_BUILD_CACHE: "{{.TASKFILE_DIR}}/../tmp/go-build"

env:
  GOCACHE: "{{.GO_BUILD_CACHE}}"

tasks:
  default:
    cmds:
      - task: check

  check:
    desc: "Full quality gate — lint + unit tests + integration tests + frontend, all in parallel after mod-tidy (govulncheck is standalone `task vuln`, not a dependency — see vuln task doc)"
    cmds:
      - task: mod-tidy
      - task: _check-parallel
      - task: build-all
    silent: false

  check-go:
    desc: "Go-only quality gate — lint + unit tests in parallel, no frontend/integration (govulncheck is standalone `task vuln`, not a dependency — see vuln task doc)"
    cmds:
      - task: mod-tidy
      - task: _check-go-parallel
      - task: build-all
    silent: false

  check-go-fast:
    desc: "Fast Go gate — lint + build in parallel, no tests"
    cmds:
      - task: mod-tidy
      - task: _check-fast-parallel
    silent: false

  _check-parallel:
    internal: true
    deps:
      - frontend-check
      - lint
      - test
      - test-integration

  _check-go-parallel:
    internal: true
    deps:
      - lint
      - test

  _check-fast-parallel:
    internal: true
    deps:
      - lint
      - build-all

  build-all:
    desc: "Build all binaries in parallel"
    deps:
      - build-server
      - build-doctor
      - build-wbt
      - build-wbt-context
      - build-wbt-hook
      - build-wbt-guard
      - build-seed
      - build-qa-seed
      - build-discordbot
      - build-wbt-eval

  mod-tidy:
    desc: "Verify go.mod and go.sum are tidy (matches CI check)"
    cmds:
      - go mod tidy
      - git diff --exit-code go.mod go.sum
    dir: ..

  vuln:
    desc: "Run govulncheck to detect known vulnerabilities. Standalone only — NOT a dependency of check/check-go, so a real finding (exit 3) never silently blocks the quality gate; run explicitly to see current CVE status."
    cmds:
      # Pinned to v1.3.0 (matches CI: .github/workflows/ci.yml) via `go run` —
      # the unpinned local govulncheck binary panics under Go 1.26 (GTD
      # 31b3f4a4, historical context). v1.3.0 does not hit that panic and
      # correctly surfaces real findings (see GTD 682b9285 for the Go
      # stdlib CVE fix tracked separately).
      - go run golang.org/x/vuln/cmd/govulncheck@v1.3.0 ./internal/... ./cmd/...
    dir: ..

  # [F981-01] frontend-check and build-frontend used to each maintain their
  # own byte-identical copy of the 5-line npm-ci/build/copy sequence; a fix to
  # one and not the other was a "passes locally, fails CI" trap. Both now
  # delegate to these two shared internal tasks instead.
  #
  # Split in two (r1 review PR1-R1-01, GTD 496106d8): _frontend-build only
  # installs+builds; the mkdir/rm/cp copy into cmd/server/web/dist is a
  # SEPARATE task (_frontend-copy-dist) that frontend-check runs only AFTER
  # lint/test pass. Copying before the gate ran meant a lint/test failure
  # still overwrote the //go:embed source directory with an unvetted build —
  # `go run ./cmd/server` would then serve frontend code that never passed
  # quality gate.
  _frontend-build:
    internal: true
    cmds:
      - npm ci --ignore-scripts
      - npm run build
    dir: ../web

  _frontend-copy-dist:
    internal: true
    cmds:
      - mkdir -p ../cmd/server/web
      - rm -rf ../cmd/server/web/dist
      - cp -r dist ../cmd/server/web/dist
    dir: ../web

  frontend-check:
    desc: "Frontend quality gate — lint, build, test, and copy dist for Go embed (skipped when sources unchanged)"
    sources:
      - src/**
      - public/**
      - index.html
      - package*.json
      - vite.config.*
      - tsconfig.*
      - eslint.config.*
    generates:
      - ../cmd/server/web/dist/**
    cmds:
      - task: _frontend-build
      - npm run lint
      - npm test
      - task: _frontend-copy-dist
    dir: ../web

  build-frontend:
    desc: "Build frontend (required by cmd/server //go:embed) — run before task check locally"
    cmds:
      - task: _frontend-build
      - task: _frontend-copy-dist

  build-server:
    desc: "Build REST API server binary to bin/, with local build identity (commit/date) injected into internal/buildinfo — GTD 61838147"
    deps:
      - go-cache
    vars:
      BUILD_COMMIT:
        sh: git rev-parse --short HEAD
      BUILD_DATE:
        sh: date -u +%Y-%m-%dT%H:%M:%SZ
    cmds:
      - mkdir -p bin
      # Version stays the "dev" sentinel (internal/buildinfo's own default).
      # A local build is not a release, and EffectiveVersion() falls through to
      # the pseudo-version derived from Commit/Date — a `go install …@vX.Y.Z`
      # build is the one that carries a real version, and it gets it from the
      # module proxy's build info, not from here. Commit/Date ARE injected so a
      # locally-built server can still answer "which commit is this" via
      # wayneblacktea://system/build-info, without pretending to be a
      # release.
      - >-
        go build -ldflags "-X github.com/Wayne997035/wayneblacktea/internal/buildinfo.Commit={{.BUILD_COMMIT}}
        -X github.com/Wayne997035/wayneblacktea/internal/buildinfo.Date={{.BUILD_DATE}}"
        -o bin/wayneblacktea-server ./cmd/server/
    dir: ..

  build-doctor:
    desc: "Build the wbt-doctor health snapshot binary used by the Stop hook"
    deps:
      - go-cache
    cmds:
      - mkdir -p bin
      - go build -o bin/wbt-doctor ./cmd/doctor/
    dir: ..

  build-wbt:
    desc: "Build the wbt CLI installer binary to bin/"
    deps:
      - go-cache
    cmds:
      - mkdir -p bin
      - go build -o bin/wbt ./cmd/wbt/
    dir: ..

  build-wbt-context:
    desc: "Build the wbt-context SessionStart hook binary to bin/"
    deps:
      - go-cache
    cmds:
      - mkdir -p bin
      - go build -o bin/wbt-context ./cmd/wbt-context/
    dir: ..

  build-wbt-hook:
    desc: "Build the wbt-hook PostToolUse hook binary to bin/"
    deps:
      - go-cache
    cmds:
      - mkdir -p bin
      - go build -o bin/wbt-hook ./cmd/wbt-hook/
    dir: ..

  build-wbt-guard:
    desc: "Build the wbt-guard PreToolUse hook binary to bin/"
    deps:
      - go-cache
    cmds:
      - mkdir -p bin
      - go build -o bin/wbt-guard ./cmd/wbt-guard/
    dir: ..

  build-seed:
    desc: "Build the wbt-seed canonical-data seeding binary to bin/"
    deps:
      - go-cache
    cmds:
      - mkdir -p bin
      - go build -o bin/wbt-seed ./cmd/seed/
    dir: ..

  build-qa-seed:
    desc: "Build the qa-seed prod-Postgres-to-disposable-SQLite binary to bin/"
    deps:
      - go-cache
    cmds:
      - mkdir -p bin
      - go build -o bin/qa-seed ./cmd/qa-seed/
    dir: ..

  qa-seed:
    desc: "Copy real prod Postgres data (read-only) into a disposable local SQLite file + write .env.test for QA. Requires .env.local (DATABASE_URL/PGSSLROOTCERT/WORKSPACE_ID). Then: go run ./cmd/server -env .env.test (serves seeded data on :8080). Extra CLI args after -- pass through (e.g. task qa-seed -- --dest ./tmp/qa.db)."
    dotenv: ['../.env.local']
    preconditions:
      - sh: test -n "{{.DATABASE_URL}}"
        msg: "DATABASE_URL is not set — add it to .env.local (qa-seed's source is always prod Postgres, read-only)"
    cmds:
      - go run ./cmd/qa-seed -env .env.local {{.CLI_ARGS}}
    dir: ..

  build-discordbot:
    desc: "Build the wbt-discordbot Discord bot binary to bin/"
    deps:
      - go-cache
    cmds:
      - mkdir -p bin
      - go build -o bin/wbt-discordbot ./cmd/discordbot/
    dir: ..

  build-wbt-eval:
    desc: "Build the wbt-eval standalone provider-backed eval CLI to bin/ (Phase 6.5 — [F0906-24] in lint/test's package lists below for its unit tests only; intentionally NOT in test-integration and this target never executes bin/wbt-eval as part of the default quality gate, see cmd/wbt-eval/main.go's package doc)"
    deps:
      - go-cache
    cmds:
      - mkdir -p bin
      - go build -o bin/wbt-eval ./cmd/wbt-eval/
    dir: ..

  lint:
    desc: "Run golangci-lint"
    deps:
      - go-cache
    cmds:
      - |
        # cmd/server embeds web/dist which requires a prior `npm run build`.
        # Exclude it so lint is not blocked by a missing frontend build artifact.
        # [F0906-22] cmd/wbt-eval added below: it was previously missing from
        # this list with no comment explaining why (unlike cmd/server above),
        # so it had never actually been linted since it was added.
        PKGS="./internal/... ./cmd/doctor/... ./cmd/wbt-context/... ./cmd/wbt-hook/... ./cmd/wbt/... ./cmd/seed/... ./cmd/qa-seed/... ./cmd/discordbot/... ./cmd/wbt-guard/... ./cmd/wbt-eval/..."
        if [ "${CODEX_SANDBOX_NETWORK_DISABLED:-}" = "1" ]; then
          GOPROXY=off golangci-lint run --config build/.golangci.yml $PKGS
        else
          golangci-lint run --config build/.golangci.yml $PKGS
        fi
    dir: ..

  test:
    desc: "Run unit tests (-short, no Docker, no race detector — fast path)"
    deps:
      - go-cache
      - py-test
    cmds:
      # -short skips testcontainers-based integration tests that require Docker.
      # No -race: mcp + sqlite packages are goroutine-heavy; race adds 5-10× overhead
      # and pushes unit tests past the 5-min budget. Use test-race for targeted race checks.
      # ./internal/... is a glob, so internal/evals' deterministic eval graders
      # (Phase 6.1-6.4) already run here on every `task check` with zero extra
      # wiring. cmd/wbt-eval (Phase 6.5) IS in this list for its unit tests
      # (validateFlags, a pure allowlist check): `go test ./cmd/wbt-eval/...`
      # compiles and runs main_test.go only — it never invokes run()/main() and
      # therefore never touches a provider or the network. What must stay out of
      # the default gate is *executing the binary* bin/wbt-eval (build-wbt-eval
      # above builds but never runs it); running the package's unit tests is
      # gate-safe and required for new-function test coverage.
      - go test -short -p 4 ./internal/... ./cmd/doctor/... ./cmd/wbt-context/... ./cmd/wbt-hook/... ./cmd/wbt/... ./cmd/seed/... ./cmd/qa-seed/... ./cmd/discordbot/... ./cmd/wbt-guard/... ./cmd/wbt-eval/...
    dir: ..

  test-race:
    desc: "Run unit tests with race detector — slower, use before release or when debugging data races"
    deps:
      - go-cache
    cmds:
      - go test -short -race -p 4 ./internal/... ./cmd/doctor/... ./cmd/wbt-context/... ./cmd/wbt-hook/... ./cmd/wbt/... ./cmd/seed/... ./cmd/qa-seed/... ./cmd/discordbot/... ./cmd/wbt-guard/...
    dir: ..

  go-cache:
    desc: "Create workspace-local Go build cache for sandboxed agent runs"
    cmds:
      - mkdir -p {{.GO_BUILD_CACHE}}
    dir: ..

  py-test:
    desc: "Run scripts/gtd-code-audit's Python unit test suite. Deliberately unittest (stdlib), not pytest — this repo's sandboxed agent runs don't have pytest installed, and this package has zero third-party deps by design (see its README's threat model)."
    cmds:
      - python3 -m unittest discover -s scripts/gtd-code-audit -p 'test_*.py'
    dir: ..

  test-integration:
    desc: "Run integration tests (requires Docker for testcontainers)"
    cmds:
      # Build tag + no -short: runs testcontainers-based integration tests.
      # -p 3 avoids concurrent Ryuk/container startup races across packages.
      #
      # -timeout 30m, not go test's 10m default. Every package here that touches
      # a store spins up its own testcontainers Postgres in TestMain, and CI
      # runners are roughly 6x slower at that than a dev machine: internal/mcp
      # measures ~100s locally and hit the 10m alarm in CI, while
      # internal/storage/sqlite alone reports 137s there. The alarm was firing
      # on a suite that was merely slow — no deadlock, no data race (verified
      # separately with -race, 0 findings) — and a timeout that trips on
      # healthy runs teaches people to re-run CI instead of reading it.
      # If a package ever genuinely hangs, 30m still bounds it.
      - go test -tags integration -p 3 -timeout 30m ./internal/... ./cmd/doctor/... ./cmd/wbt-context/... ./cmd/wbt-hook/... ./cmd/wbt/... ./cmd/seed/... ./cmd/qa-seed/... ./cmd/discordbot/... ./cmd/wbt-guard/...
    dir: ..

  migrate-up:
    desc: "Apply DB migrations (requires .env.local with DATABASE_URL)"
    dotenv: ['../.env.local']
    preconditions:
      - sh: test -n "{{.DATABASE_URL}}"
        msg: "DATABASE_URL is not set — add it to .env"
    cmds:
      - migrate -path migrations/ -database "{{.DATABASE_URL}}" up
    dir: ..

  guard-prune:
    desc: "Prune guard_events / guard_bypasses older than 30 days (run via cron)"
    dotenv: ['../.env.local']
    preconditions:
      - sh: test -n "{{.DATABASE_URL}}"
        msg: "DATABASE_URL is not set — add it to .env or export it"
    cmds:
      # 30-day TTL on observability tables, codified by docs/p0a-design-rationale.md §6.1.
      # Postgres-only: SQLite is dev-local single-tenant, no growth concern.
      - |
        psql "{{.DATABASE_URL}}" -v ON_ERROR_STOP=1 -c "DELETE FROM guard_events WHERE created_at < NOW() - INTERVAL '30 days';"
      - |
        psql "{{.DATABASE_URL}}" -v ON_ERROR_STOP=1 -c "DELETE FROM guard_bypasses WHERE expires_at IS NOT NULL AND expires_at < NOW() - INTERVAL '30 days';"
    dir: ..

  discipline-prune:
    desc: "Prune discipline_events older than 30 days (run via cron)"
    dotenv: ['../.env.local']
    preconditions:
      - sh: test -n "{{.DATABASE_URL}}"
        msg: "DATABASE_URL is not set — add it to .env or export it"
    cmds:
      # 30-day TTL on observability tables (backend-security-design.md §1.3).
      # Postgres-only: SQLite is dev-local single-tenant, no growth concern.
      - |
        psql "{{.DATABASE_URL}}" -v ON_ERROR_STOP=1 -c "DELETE FROM discipline_events WHERE observed_at < NOW() - INTERVAL '30 days';"
    dir: ..

  pending-proposals-prune:
    desc: "Prune pending_proposals: resolved >90d + stale pending decision >180d"
    dotenv: ['../.env.local']
    preconditions:
      - sh: test -n "{{.DATABASE_URL}}"
        msg: "DATABASE_URL is not set — add it to .env or export it"
    cmds:
      # 90-day TTL for accepted/rejected; 180-day TTL for stale pending decision rows.
      # Other pending types (goal/project/concept/…) represent unresolved user intent
      # and are NOT touched. Backed by scheduler.runDailyPendingProposalsPrune which
      # runs at 03:00 Asia/Taipei when the server is up; this Taskfile target lets
      # operators force the cleanup on demand.
      - |
        psql "{{.DATABASE_URL}}" -v ON_ERROR_STOP=1 -c "DELETE FROM pending_proposals WHERE (status IN ('accepted','rejected') AND resolved_at < NOW() - INTERVAL '90 days') OR (status = 'pending' AND created_at < NOW() - INTERVAL '180 days' AND type = 'decision');"
    dir: ..

  migrate-down:
    desc: "Roll back last DB migration (requires .env.local with DATABASE_URL)"
    dotenv: ['../.env.local']
    preconditions:
      - sh: test -n "{{.DATABASE_URL}}"
        msg: "DATABASE_URL is not set — add it to .env"
    cmds:
      - migrate -path migrations/ -database "{{.DATABASE_URL}}" down 1
    dir: ..

  sqlc:
    desc: "Regenerate sqlc code"
    cmds:
      - sqlc generate
    dir: ..

  clean:
    desc: "Remove build artifacts"
    cmds:
      - rm -rf bin/
    dir: ..
