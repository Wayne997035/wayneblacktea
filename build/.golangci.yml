version: "2"

run:
  go: "1.26.3"
  timeout: 5m
  modules-download-mode: readonly

formatters:
  enable:
    - gofmt
    - goimports
    - gofumpt # stricter gofmt: no extra blank lines, canonical import grouping

linters:
  enable:
    # Static analysis
    - govet
    - staticcheck
    - ineffassign
    - unused
    # Errors
    - errcheck
    - wrapcheck
    # Quality
    - misspell
    - gocyclo
    - dupl       # detects copy-paste code duplication
    - goconst    # repeated string constants should be named
    - bodyclose
    # Style
    - gocritic
    - lll
    - noctx      # no context.Background/TODO in http handler path
    - nilnil
    # Security
    - gosec
    # Completeness
    - exhaustive # switch on enum must cover all cases (or have default)
    # Audit integrity
    - nolintlint # every //nolint must name the linter + have a reason
    # Context propagation
    - contextcheck # context must flow through call chain, not Background mid-stack

    # Security hardening (Security-Critical Profile)
    - bidichk      # detect dangerous unicode bidi characters (supply chain attack vector)
    - copyloopvar  # loop variable capture safety
    - nilerr       # detect returning nil error incorrectly (silent error drop)
    - loggercheck  # structured logging key/value pairing mistakes
    - unqueryvet   # SQL injection second-pass detection (golangci-lint v2.5+)
    - depguard     # block known-dangerous package imports at lint time

  settings:
    wrapcheck:
      extra-ignore-sigs:
        - "github.com/labstack/echo/v4.Context).JSON("
        - "github.com/labstack/echo/v4.Context).String("
        - "github.com/labstack/echo/v4.Context).NoContent("
    lll:
      line-length: 140
    gocyclo:
      min-complexity: 15
    dupl:
      threshold: 150
    goconst:
      min-len: 3
      min-occurrences: 3
    exhaustive:
      default-signifies-exhaustive: true
    nolintlint:
      require-explanation: true  # //nolint:lintername // reason: ... is required
      require-specific: true     # //nolint (no linter name) is rejected
    gosec:
      severity: low      # report all severity levels
      confidence: low    # report all confidence levels including taint analysis (G7xx)
      excludes:
        - G703 # seed CLI uses user-controlled PROJECT_ROOT intentionally
        - G706 # slog structured logging is not vulnerable to log injection
    depguard:
      rules:
        security-sensitive:
          deny:
            - pkg: "crypto/md5"
              desc: "MD5 is cryptographically broken; use crypto/sha256 or stronger"
            - pkg: "crypto/des"
              desc: "DES is broken; use AES-GCM"
            - pkg: "crypto/rc4"
              desc: "RC4 is broken; use AES-GCM"
            - pkg: "crypto/sha1"
              desc: "SHA1 is broken for security use; use crypto/sha256 or stronger"
            - pkg: "net/http/cgi"
              desc: "CGI has known security implications"
            - pkg: "math/rand"
              desc: "Use crypto/rand for security-sensitive randomness; math/rand is predictable"
    unqueryvet:
      check-sql-injection: true
    errcheck:
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
        - (io.Closer).Close

  exclusions:
    paths:
      - web/node_modules
    rules:
      - path: "_test.go"
        linters:
          - wrapcheck
          - dupl       # test helpers are intentionally repetitive
          - contextcheck # test setup often uses context.Background() legitimately
          - nilnil     # test stubs legitimately return (nil, nil) for unexercised methods
      - path: "internal/mcp/"
        linters:
          - nilerr     # MCP tool handlers return (*ToolResult, nil) — ToolResult carries user-facing error, nil Go error is correct by mcp-go convention
      - path: "internal/storage/sqlite/db.go"
        linters:
          - unqueryvet # ExecContext/QueryRowContext are generic wrappers; schemaSQL is embedded constant; all call sites use parameterized args (no interpolation)

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
