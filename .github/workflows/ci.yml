name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Least-privilege: read-only token. No workflow in this repo needs write —
# releases are git tags served by the Go module proxy, not built artifacts.
permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Verify no FK constraints in migration SQL files
        run: |
          # Exclude comment-only lines (lines where content after filename:linenum: starts with --)
          if grep -rn 'FOREIGN KEY\|REFERENCES\|ON DELETE\|ON UPDATE' migrations/ --include='*.sql' | grep -v ':[[:space:]]*--'; then
            echo "ERROR: FK constraint found in migrations/ — workspace policy forbids FK constraints in any DB schema path"
            exit 1
          fi

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Install Task
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install golangci-lint v2
        run: |
          # [F0925-28] install.sh pinned to the v2.11.4 tag commit
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/8f3b0c7ed018e57905fbd873c697e0b1ede605a5/install.sh \
            | sh -s -- -b $(go env GOPATH)/bin v2.11.4

      - name: Run lint
        working-directory: build
        run: task lint

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Task
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run unit tests
        working-directory: build
        run: task test

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Verify no VITE_*KEY in frontend source
        run: |
          if grep -r 'VITE_.*KEY' web/src/; then
            echo "ERROR: VITE_*KEY found in web/src/ — API keys must not be embedded in JS bundles"
            exit 1
          fi

      - name: Cache frontend dist (skip npm build when web/ unchanged)
        id: frontend-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: cmd/server/web/dist
          key: frontend-dist-${{ hashFiles('web/src/**', 'web/public/**', 'web/index.html', 'web/package-lock.json', 'web/vite.config.*', 'web/tsconfig.*') }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.frontend-cache.outputs.cache-hit != 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # [GTD 4330b849] The lint and test lines run here so a broken frontend
      # fails the PR rather than the deploy. They are NOT the invariant's
      # enforcement point: this step is skipped on a frontend-dist cache hit,
      # and Railway never runs this workflow at all (railway.toml pins
      # builder="dockerfile" / dockerfilePath="build/Dockerfile"). The gate
      # that actually holds is the identical pair in build/Dockerfile's
      # frontend stage, which has no cache and sits on the real ship path.
      - name: Lint, test and build frontend (required by //go:embed)
        if: steps.frontend-cache.outputs.cache-hit != 'true'
        run: |
          cd web
          npm ci --ignore-scripts
          npm run lint
          npm run test
          npm run build
          mkdir -p ../cmd/server/web
          cp -r dist ../cmd/server/web/dist

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Task
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build all binaries
        working-directory: build
        run: task build-all

  # [F0925-26] Runs on every push/PR unconditionally, not just when go.mod /
  # go.sum changed — an upstream advisory on an already-committed dependency
  # needs to surface even when this diff doesn't touch dependency files.
  vuln:
    name: vuln check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      # [F1123-02] govulncheck has no ignore list, so the gate reads its JSON
      # and fails on any called (symbol-level) vulnerability except the IDs in
      # ALLOWED_VULNS. An ID belongs there only while the Go vulnerability
      # database lists no fixed version for it; once the database records a
      # fix, the ID blocks again until the dependency is upgraded, and the
      # step warns when an allowed ID stops appearing so it can be removed.
      #   GO-2026-6875 (GHSA-99jh-6h7p-pp36) and GO-2026-6872
      #   (GHSA-246p-cpwv-v3jq): fixed upstream in echo v4.16.3 (go.mod pins
      #   v4.16.6), but the database still lists every echo/v4 version as
      #   affected. Moving to echo v5 also removes them.
      - name: Install and run govulncheck
        env:
          ALLOWED_VULNS: GO-2026-6875 GO-2026-6872
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
          out="$RUNNER_TEMP/govulncheck"
          mkdir -p "$out"
          govulncheck -format json ./... > "$out/scan.json"
          jq -s -e 'map(select(.config)) | length == 1' "$out/scan.json" > /dev/null \
            || { echo "::error::govulncheck produced no scan result"; exit 1; }
          jq -r 'select(.finding.trace[0].function != null) | .finding | "\(.osv)\t\(.fixed_version // "")"' \
            "$out/scan.json" | sort -u > "$out/called.tsv"
          cut -f1 "$out/called.tsv" | sort -u > "$out/called.txt"
          awk -F'\t' '$2 != "" {print $1}' "$out/called.tsv" | sort -u > "$out/fixable.txt"
          printf '%s\n' $ALLOWED_VULNS | sed '/^$/d' | sort -u > "$out/allowed.txt"
          comm -23 "$out/called.txt" "$out/allowed.txt" > "$out/blocking.txt"
          comm -12 "$out/fixable.txt" "$out/allowed.txt" > "$out/fix-available.txt"
          comm -13 "$out/called.txt" "$out/allowed.txt" > "$out/stale.txt"
          echo "called vulnerabilities: $(tr '\n' ' ' < "$out/called.txt")"
          while read -r id; do
            echo "::warning::$id is allowed but no longer reported; remove it from ALLOWED_VULNS"
          done < "$out/stale.txt"
          while read -r id; do
            echo "::error::$id now has a fixed version in the vulnerability database; upgrade and remove it from ALLOWED_VULNS"
          done < "$out/fix-available.txt"
          while read -r id; do
            jq -r --arg id "$id" 'select(.osv.id == $id) | .osv | "::error::\(.id): \(.summary)"' "$out/scan.json"
          done < "$out/blocking.txt"
          if [ -s "$out/blocking.txt" ] || [ -s "$out/fix-available.txt" ]; then
            exit 1
          fi

  discipline-classification-signoff:
    name: discipline classification sign-off check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 2

      # A structural test (TestMCPServer_AllRegisteredToolsClassified) can
      # only prove every registered tool is classified SOMEWHERE (either
      # discipline.MutatingTools or discipline.DeliberatelyExcludedTools),
      # not that it is classified in the CORRECT map. Mislabeling a
      # genuinely-mutating tool as a cache/candidate write would silently
      # slip past that test. Flag any diff touching
      # DeliberatelyExcludedTools so it gets manual security sign-off
      # before merge, instead of relying on the structural test alone.
      - name: Warn if DeliberatelyExcludedTools changed (manual security sign-off required)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="HEAD~1"
          fi
          if git diff "$BASE" HEAD -- internal/discipline/discipline.go | grep -q 'DeliberatelyExcludedTools'; then
            echo "::warning file=internal/discipline/discipline.go::This diff touches discipline.DeliberatelyExcludedTools. A structural test only proves every registered tool is classified SOMEWHERE, not that it is classified in the CORRECT map — manual security sign-off is required before merge to confirm no genuinely-mutating tool was mislabeled as a read-only/cache-write exclusion."
          fi

  integration:
    name: integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Task
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run integration tests
        working-directory: build
        run: task test-integration
