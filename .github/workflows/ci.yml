name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Least-privilege: read-only token. Write access is only in release.yml.
permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Verify no FK constraints in migration SQL files
        run: |
          # Exclude comment-only lines (lines where content after filename:linenum: starts with --)
          if grep -rn 'FOREIGN KEY\|REFERENCES\|ON DELETE\|ON UPDATE' migrations/ --include='*.sql' | grep -v ':[[:space:]]*--'; then
            echo "ERROR: FK constraint found in migrations/ — workspace policy forbids FK constraints in any DB schema path (CLAUDE.md #9)"
            exit 1
          fi

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Install Task
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install golangci-lint v2
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
            | sh -s -- -b $(go env GOPATH)/bin v2.11.4

      - name: Run lint
        working-directory: build
        run: task lint

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Task
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run unit tests
        working-directory: build
        run: task test

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Verify no VITE_*KEY in frontend source
        run: |
          if grep -r 'VITE_.*KEY' web/src/; then
            echo "ERROR: VITE_*KEY found in web/src/ — API keys must not be embedded in JS bundles"
            exit 1
          fi

      - name: Cache frontend dist (skip npm build when web/ unchanged)
        id: frontend-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: cmd/server/web/dist
          key: frontend-dist-${{ hashFiles('web/src/**', 'web/public/**', 'web/index.html', 'web/package-lock.json', 'web/vite.config.*', 'web/tsconfig.*') }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.frontend-cache.outputs.cache-hit != 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend (required by //go:embed)
        if: steps.frontend-cache.outputs.cache-hit != 'true'
        run: |
          cd web
          npm ci
          npm run build
          mkdir -p ../cmd/server/web
          cp -r dist ../cmd/server/web/dist

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Task
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build all binaries
        working-directory: build
        run: task build-all

  vuln:
    name: vuln check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 2

      - name: Detect go.mod / go.sum changes
        id: deps
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            git diff --name-only "$BASE" HEAD | grep -q 'go\.mod\|go\.sum' \
              && echo "changed=true" >> $GITHUB_OUTPUT \
              || echo "changed=false" >> $GITHUB_OUTPUT
          else
            git diff --name-only HEAD~1 HEAD | grep -q 'go\.mod\|go\.sum' \
              && echo "changed=true" >> $GITHUB_OUTPUT \
              || echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        if: steps.deps.outputs.changed == 'true'
        with:
          go-version-file: go.mod
          cache: true

      - name: Install and run govulncheck
        if: steps.deps.outputs.changed == 'true'
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
          govulncheck ./...

  discipline-classification-signoff:
    name: discipline classification sign-off check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 2

      # A structural test (TestMCPServer_AllRegisteredToolsClassified) can
      # only prove every registered tool is classified SOMEWHERE (either
      # discipline.MutatingTools or discipline.DeliberatelyExcludedTools),
      # not that it is classified in the CORRECT map. Mislabeling a
      # genuinely-mutating tool as a cache/candidate write would silently
      # slip past that test. Flag any diff touching
      # DeliberatelyExcludedTools so it gets manual security sign-off
      # before merge, instead of relying on the structural test alone.
      - name: Warn if DeliberatelyExcludedTools changed (manual security sign-off required)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="HEAD~1"
          fi
          if git diff "$BASE" HEAD -- internal/discipline/discipline.go | grep -q 'DeliberatelyExcludedTools'; then
            echo "::warning file=internal/discipline/discipline.go::This diff touches discipline.DeliberatelyExcludedTools. A structural test only proves every registered tool is classified SOMEWHERE, not that it is classified in the CORRECT map — manual security sign-off is required before merge to confirm no genuinely-mutating tool was mislabeled as a read-only/cache-write exclusion."
          fi

  integration:
    name: integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Task
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run integration tests
        working-directory: build
        run: task test-integration
