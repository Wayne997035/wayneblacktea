name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Least-privilege: read-only token. Write access is only in release.yml.
permissions:
  contents: read

jobs:
  check:
    name: task check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Verify no FK constraints in migration SQL files
        run: |
          # Exclude comment-only lines (lines where content after filename:linenum: starts with --)
          if grep -rn 'FOREIGN KEY\|REFERENCES\|ON DELETE\|ON UPDATE' migrations/ --include='*.sql' | grep -v ':[[:space:]]*--'; then
            echo "ERROR: FK constraint found in migrations/ — workspace policy forbids FK constraints in any DB schema path (CLAUDE.md #9)"
            exit 1
          fi

      - name: Verify no VITE_*KEY in frontend source
        run: |
          if grep -r 'VITE_.*KEY' web/src/; then
            echo "ERROR: VITE_*KEY found in web/src/ — API keys must not be embedded in JS bundles"
            exit 1
          fi

      - name: Build frontend (required by //go:embed)
        run: |
          cd web
          npm ci
          npm run build
          mkdir -p ../cmd/server/web
          cp -r dist ../cmd/server/web/dist

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Task
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install golangci-lint v2
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.4

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.3.0

      - name: Check go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: task check
        working-directory: build
        run: task check

  integration:
    name: integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Task
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run integration tests
        working-directory: build
        run: task test-integration
